[project]
name = "qml-cnn-welds"
version = "0.1.0"
description = "Compact research code for weld-inspired image classification experiments."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=1.13",
  "numpy>=1.19",
  "scikit-learn>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
quantum = [
  "pennylane>=0.37",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
